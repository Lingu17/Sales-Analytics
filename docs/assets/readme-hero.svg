<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Sales Analytics — Three years of sales. One dashboard.</title>
  <desc id="desc">Sales Analytics is a React and Convex dashboard that filters three years of monthly sales by year and revenue and renders them as bar, line or pie charts.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#17132f"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#94a3b8" opacity=".12"/></pattern>
  </defs>
  <rect width="1200" height="460" rx="24" fill="url(#background)"/>
  <rect width="1200" height="460" rx="24" fill="url(#dots)"/>
  <path d="M700 0H1100L800 460H400Z" fill="#38bdf8" opacity=".04"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <path d="m57 40 16-8 16 8-16 8Zm0 8 16 8 16-8M57 56l16 8 16-8" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="103" y="56" fill="#f8fafc" font-size="23.0" font-weight="700">Sales<tspan fill="#38bdf8"> Analytics</tspan></text>
    <text x="56" y="128" fill="#f8fafc" font-size="54.0" font-weight="750" letter-spacing="-2">Three years of sales.</text>
    <text x="56" y="190" fill="url(#accent)" font-size="54.0" font-weight="750" letter-spacing="-2">One dashboard.</text>
    <text x="58" y="228" fill="#cbd5e1" font-size="18.0">React and Convex dashboard with reactive queries, filters and switchable charts.</text>
    <rect x="842" y="72" width="302" height="159" rx="14" fill="#0b1020" stroke="#37304f"/>
    <path d="M842 110h302" stroke="#37304f"/>
    <circle cx="861" cy="91" r="4" fill="#38bdf8"/><circle cx="876" cy="91" r="4" fill="#475569"/><circle cx="891" cy="91" r="4" fill="#475569"/>
    <text x="916" y="96" fill="#94a3b8" font-size="12">sales / query</text>
    <g font-family="Consolas,Monaco,monospace" font-size="14.0">
      <text x="862" y="138" fill="#38bdf8">year<tspan fill="#94a3b8"> → indexed query</tspan></text>
      <text x="862" y="166" fill="#818cf8">min revenue<tspan fill="#94a3b8"> → filter</tspan></text>
      <text x="862" y="194" fill="#34d399">results<tspan fill="#94a3b8"> → bar, line, pie</tspan></text>
    </g>
    <g fill="#191c30" stroke="#35354e">
      <rect x="56" y="282" width="258" height="106" rx="12"/>
      <rect x="332" y="282" width="258" height="106" rx="12"/>
      <rect x="608" y="282" width="258" height="106" rx="12"/>
      <rect x="884" y="282" width="260" height="106" rx="12"/>
    </g>
    <g fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="2">
      <text x="76" y="309">01 / SIGN IN</text>
      <text x="352" y="309">02 / SEED</text>
      <text x="628" y="309">03 / FILTER</text>
      <text x="904" y="309">04 / VISUALIZE</text>
    </g>
    <text x="76" y="341" fill="#f1f5f9" font-size="17.0" font-weight="650">Use Convex Auth</text>
    <text x="76" y="367" fill="#94a3b8" font-size="13.0">Password or anonymous</text>
    <text x="352" y="341" fill="#f1f5f9" font-size="17.0" font-weight="650">Load sample data</text>
    <text x="352" y="367" fill="#94a3b8" font-size="13.0">2022–2024 monthly sales</text>
    <text x="628" y="341" fill="#f1f5f9" font-size="17.0" font-weight="650">Slice by year + revenue</text>
    <text x="628" y="367" fill="#94a3b8" font-size="13.0">Reactive Convex queries</text>
    <text x="904" y="341" fill="#f1f5f9" font-size="17.0" font-weight="650">Switch chart types</text>
    <text x="904" y="367" fill="#94a3b8" font-size="13.0">Recharts bar, line, pie</text>
    <text x="56" y="428" fill="#64748b" font-size="13">React 19 · TypeScript · Vite · Convex · Convex Auth · Recharts · Tailwind CSS</text>
  </g>
</svg>
